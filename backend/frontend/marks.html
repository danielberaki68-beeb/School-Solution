<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>School Solution - Marks & Grades</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #1f2937;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #172554;
            color: white;
            padding: 20px 15px;
            overflow-y: auto;
        }

        .logo {
            text-align: center;
            padding: 15px 5px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 15px;
        }

        .logo h2 {
            font-size: 21px;
        }

        .logo p {
            margin-top: 5px;
            opacity: .8;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin: 5px 0;
        }

        .menu button {
            width: 100%;
            border: none;
            background: transparent;
            color: white;
            padding: 13px 15px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .menu button:hover,
        .menu button.active {
            background: #2563eb;
        }

        .menu-icon {
            display: inline-block;
            width: 28px;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            height: 70px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .logout-btn {
            border: none;
            background: #dc2626;
            color: white;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .content {
            padding: 30px;
        }

        /* HEADER */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin-bottom: 5px;
        }

        .page-header p {
            color: #6b7280;
        }

        /* BUTTONS */

        .primary-button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        .secondary-button {
            border: none;
            background: #e5e7eb;
            color: #111827;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .danger-button {
            border: none;
            background: #dc2626;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .edit-button {
            border: none;
            background: #f59e0b;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .view-button {
            border: none;
            background: #059669;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* PANEL */

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,.07);
            margin-bottom: 25px;
        }

        /* TOOLBAR */

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 220px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        /* TABLE */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        tr:hover {
            background: #f9fafb;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-field label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        /* SUMMARY */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,.06);
        }

        .summary-card p {
            color: #6b7280;
            margin-bottom: 8px;
        }

        .summary-card h2 {
            font-size: 28px;
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: #6b7280;
        }

        /* MOBILE */

        @media(max-width:900px) {

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width:700px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
            }

            .content {
                padding: 15px;
            }

            .topbar {
                padding: 0 15px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

     SIDEBAR
========================================================= -->

    <div class="logo">

        <h2>
            🏫 School Solution
        </h2>

        <p>
            መፍትሕ
        </p>

    </div>


    <ul class="menu">

        <li>
            <button onclick="go('dashboard.html')">
                <span class="menu-icon">🏠</span>

        </li>

        <li>

        </li>

        <li>

        </li>

        <li>
            <button onclick="go('subjects.html')">
                <span class="menu-icon">📚</span>

            </button>
        </li>

        <li>
            <button onclick="go('teachers.html')">
                <span class="menu-icon">👨‍🏫</span>
                Teachers
            </button>
        </li>

        <li>
            <button class="active">
                <span class="menu-icon">📝</span>

            </button>
        </li>

        <li>
            <button onclick="go('attendance.html')">
                <span class="menu-icon">📅</span>

            </button>
        </li>

        <li>
            <button onclick="go('fees.html')">

        </li>

        <li>
            <button onclick="go('receipts.html')">

            </button>
        </li>

        <li>
            <button onclick="go('reports.html')">

            </button>

            </button>

</aside>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


    <header class="topbar">

        <h1>
            Marks / Grades
        </h1>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </header>


    <section
        class="content"
        id="contentArea"
    >

        Loading...

    </section>


</main>


<script src="app.js"></script>


<script>


// ============================================================
// NAVIGATION
// ============================================================

function go(page) {

    window.location.href = page;

}


function logout() {

    localStorage.removeItem(
        "school_token"
    );

    localStorage.removeItem(
        "school_user"
    );

    window.location.href =
        "index.html";

}


// ============================================================
// DATA
// ============================================================

let students = [];

let subjects = [];

let marks = [];


// ============================================================
// LOAD PAGE
// ============================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadMarksPage();

    }
);


// ============================================================
// LOAD EVERYTHING
// ============================================================

async function loadMarksPage() {

    const area =
        document.getElementById(
            "contentArea"
        );

    area.innerHTML = `
        <div class="panel">
            Loading marks...
        </div>
    `;


    try {

        students =
            await apiRequest(
                "/api/students/"
            );


        subjects =
            await apiRequest(
                "/api/subjects/"
            );


        marks =
            await apiRequest(
                "/api/marks/"
            );


        renderMarksPage();


    } catch (error) {

        area.innerHTML = `

            <div class="panel">

                <div class="message error">

                    Unable to load marks:

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            </div>

        `;

    }

}


// ============================================================
// MAIN PAGE
// ============================================================

function renderMarksPage() {

    const area =
        document.getElementById(
            "contentArea"
        );


    area.innerHTML = `

        <div class="page-header">

            <div>

                <h1>
                    Marks & Grades
                </h1>

                <p>
                    Manage student marks and results
                </p>

            </div>


            <button
                class="primary-button"
                onclick="showMarkForm()"
            >
                + Add Mark
            </button>

        </div>


        <div class="summary-grid">

            <div class="summary-card">

                <p>
                    Total Marks
                </p>

                <h2>
                    ${marks.length}
                </h2>

            </div>


            <div class="summary-card">

                <p>
                    Students
                </p>

                <h2>
                    ${students.length}
                </h2>

            </div>


            <div class="summary-card">

                <p>
                    Subjects
                </p>

                <h2>
                    ${subjects.length}
                </h2>

            </div>


            <div class="summary-card">

                <p>
                    Average Mark
                </p>

                <h2>
                    ${calculateAverage()}
                </h2>

            </div>

        </div>


        <div class="panel">

            <div class="toolbar">

                <input
                    id="markSearch"
                    class="search-input"
                    placeholder="Search student, subject, grade..."
                >


                <button
                    class="secondary-button"
                    onclick="loadMarksPage()"
                >
                    Refresh
                </button>

            </div>


            <div id="marksTable">

                Loading...

            </div>

        </div>

    `;


    renderMarksTable(
        marks
    );


    const search =
        document.getElementById(
            "markSearch"
        );


    if (search) {

        search.addEventListener(
            "input",
            function () {

                const value =
                    this.value
                        .toLowerCase()
                        .trim();


                const filtered =
                    marks.filter(
                        function (mark) {

                            const student =
                                getStudentName(
                                    mark.student_id
                                );

                            const subject =
                                getSubjectName(
                                    mark.subject_id
                                );


                            return (

                                student
                                    .toLowerCase()
                                    .includes(value)

                                ||

                                subject
                                    .toLowerCase()
                                    .includes(value)

                                ||

                                String(
                                    mark.grade_name || ""
                                )
                                .toLowerCase()
                                .includes(value)

                                ||

                                String(
                                    mark.mark || ""
                                )
                                .includes(value)

                            );

                        }
                    );


                renderMarksTable(
                    filtered
                );

            }
        );

    }

}


// ============================================================
// AVERAGE
// ============================================================

function calculateAverage() {

    if (!marks.length) {
        return "0.00";
    }


    const total =
        marks.reduce(
            function (sum, item) {

                return sum +
                    Number(
                        item.mark || 0
                    );

            },
            0
        );


    return (
        total / marks.length
    ).toFixed(2);

}


// ============================================================
// STUDENT NAME
// ============================================================

function getStudentName(
    studentId
) {

    const student =
        students.find(
            function (item) {

                return Number(item.id) ===
                    Number(studentId);

            }
        );


    if (!student) {

        return "Student #" +
            studentId;

    }


    return (
        student.name ||
        student.full_name ||
        student.student_name ||
        ("Student #" + studentId)
    );

}


// ============================================================
// SUBJECT NAME
// ============================================================

function getSubjectName(
    subjectId
) {

    const subject =
        subjects.find(
            function (item) {

                return Number(item.id) ===
                    Number(subjectId);

            }
        );


    if (!subject) {

        return "Subject #" +
            subjectId;

    }


    return (
        subject.name ||
        ("Subject #" + subjectId)
    );

}


// ============================================================
// TABLE
// ============================================================

function renderMarksTable(
    data
) {

    const container =
        document.getElementById(
            "marksTable"
        );


    if (!container) {
        return;
    }


    if (!data.length) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No marks found
                </h3>

                <p>
                    Click "Add Mark" to enter a student's result.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Student
                        </th>

                        <th>
                            Subject
                        </th>

                        <th>
                            Year
                        </th>

                        <th>
                            Term
                        </th>

                        <th>
                            Mark
                        </th>

                        <th>
                            Grade
                        </th>

                        <th>
                            Point
                        </th>

                        <th>
                            Remark
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${data.map(
                        function (item) {

                            return `

                                <tr>

                                    <td>
                                        ${item.id}
                                    </td>

                                    <td>

                                        ${escapeHtml(
                                            getStudentName(
                                                item.student_id
                                            )
                                        )}

                                    </td>

                                    <td>

                                        ${escapeHtml(
                                            getSubjectName(
                                                item.subject_id
                                            )
                                        )}

                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            item.academic_year || "-"
                                        )}
                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            item.term || "-"
                                        )}
                                    </td>

                                    <td>

                                        <strong>
                                            ${item.mark}
                                        </strong>

                                    </td>

                                    <td>

                                        <strong>
                                            ${escapeHtml(
                                                item.grade_name || "-"
                                            )}
                                        </strong>

                                    </td>

                                    <td>
                                        ${item.grade_point ?? "-"}
                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            item.grade_remark || "-"
                                        )}
                                    </td>

                                    <td>

                                        <div class="actions">

                                            <button
                                                class="view-button"
                                                onclick="viewMark(${item.id})"
                                            >
                                                View
                                            </button>


                                            <button
                                                class="edit-button"
                                                onclick="editMark(${item.id})"
                                            >
                                                Edit
                                            </button>


                                            <button
                                                class="danger-button"
                                                onclick="deleteMark(${item.id})"
                                            >
                                                Delete
                                            </button>

                                        </div>

                                    </td>

                                </tr>

                            `;

                        }
                    ).join("")}

                </tbody>

            </table>

        </div>

    `;

}


// ============================================================
// ADD / EDIT FORM
// ============================================================

function showMarkForm(
    existing = null
) {

    const editing =
        !!existing;


    const area =
        document.getElementById(
            "contentArea"
        );


    area.innerHTML = `

        <div class="page-header">

            <div>

                <h1>

                    ${
                        editing
                            ? "Edit Mark"
                            : "Add Mark"
                    }

                </h1>


                <p>

                    ${
                        editing
                            ? "Update student result"
                            : "Enter a new student mark"
                    }

                </p>

            </div>


            <button
                class="secondary-button"
                onclick="renderMarksPage()"
            >
                ← Back
            </button>

        </div>


        <div class="panel">

            <form
                id="markForm"
            >


                <div class="form-grid">


                    <div class="form-field">

                        <label>
                            Student *
                        </label>


                        <select
                            id="mark_student"
                            required
                        >

                            <option value="">
                                Select Student
                            </option>

                            ${students.map(
                                function(student) {

                                    const selected =
                                        editing &&
                                        Number(
                                            existing.student_id
                                        ) ===
                                        Number(
                                            student.id
                                        )
                                            ? "selected"
                                            : "";

                                    return `

                                        <option
                                            value="${student.id}"
                                            ${selected}
                                        >

                                            ${escapeHtml(
                                                getStudentName(
                                                    student.id
                                                )
                                            )}

                                        </option>

                                    `;

                                }
                            ).join("")}

                        </select>

                    </div>


                    <div class="form-field">

                        <label>
                            Subject *
                        </label>


                        <select
                            id="mark_subject"
                            required
                        >

                            <option value="">
                                Select Subject
                            </option>

                            ${subjects.map(
                                function(subject) {

                                    const selected =
                                        editing &&
                                        Number(
                                            existing.subject_id
                                        ) ===
                                        Number(
                                            subject.id
                                        )
                                            ? "selected"
                                            : "";

                                    return `

                                        <option
                                            value="${subject.id}"
                                            ${selected}
                                        >

                                            ${escapeHtml(
                                                subject.name
                                            )}

                                        </option>

                                    `;

                                }
                            ).join("")}

                        </select>

                    </div>


                    <div class="form-field">

                        <label>
                            Academic Year *
                        </label>


                        <input
                            id="mark_year"
                            required
                            value="${
                                editing
                                    ? escapeAttribute(
                                        existing.academic_year
                                    )
                                    : "2026/2027"
                            }"
                            placeholder="2026/2027"
                        >

                    </div>


                    <div class="form-field">

                        <label>
                            Term *
                        </label>


                        <select
                            id="mark_term"
                            required
                        >

                            <option value="">
                                Select Term
                            </option>

                            <option
                                value="1"
                                ${
                                    editing &&
                                    existing.term === "1"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Term 1
                            </option>

                            <option
                                value="2"
                                ${
                                    editing &&
                                    existing.term === "2"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Term 2
                            </option>

                            <option
                                value="3"
                                ${
                                    editing &&
                                    existing.term === "3"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Term 3
                            </option>

                        </select>

                    </div>


                    <div class="form-field">

                        <label>
                            Mark *
                        </label>


                        <input
                            id="mark_value"
                            type="number"
                            min="0"
                            max="100"
                            step="0.01"
                            required
                            value="${
                                editing
                                    ? existing.mark
                                    : ""
                            }"
                            placeholder="0 - 100"
                            oninput="previewGrade()"
                        >

                    </div>


                    <div class="form-field">

                        <label>
                            Grade Preview
                        </label>


                        <input
                            id="grade_preview"
                            readonly
                            placeholder="Enter mark"
                        >

                    </div>


                    <div
                        class="form-field full-width"
                    >

                        <label>
                            Teacher Comment
                        </label>


                        <textarea
                            id="teacher_comment"
                            placeholder="Optional teacher comment..."
                        >${
                            editing
                                ? escapeHtml(
                                    existing.teacher_comment || ""
                                )
                                : ""
                        }</textarea>

                    </div>


                </div>


                <div
                    id="markMessage"
                ></div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="secondary-button"
                        onclick="renderMarksPage()"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="primary-button"
                    >

                        ${
                            editing
                                ? "Update Mark"
                                : "Save Mark"
                        }

                    </button>

                </div>


            </form>

        </div>

    `;


    document
        .getElementById("markForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                await saveMark(
                    editing
                        ? existing.id
                        : null
                );

            }
        );


    if (editing) {
        previewGrade();
    }

}


// ============================================================
// GRADE PREVIEW
// ============================================================

function previewGrade() {

    const input =
        document.getElementById(
            "mark_value"
        );

    const preview =
        document.getElementById(
            "grade_preview"
        );


    if (!input || !preview) {
        return;
    }


    const mark =
        Number(
            input.value
        );


    if (
        input.value === "" ||
        Number.isNaN(mark)
    ) {

        preview.value = "";

        return;

    }


    if (mark < 0 || mark > 100) {

        preview.value =
            "Invalid mark";

        return;

    }


    // This is only a visual preview.
    // The backend remains responsible
    // for the official grade.

    if (mark >= 90) {

        preview.value =
            "A+";

    } else if (mark >= 80) {

        preview.value =
            "A";

    } else if (mark >= 70) {

        preview.value =
            "B";

    } else if (mark >= 60) {

        preview.value =
            "C";

    } else if (mark >= 50) {

        preview.value =
            "D";

    } else {

        preview.value =
            "F";

    }

}


// ============================================================
// SAVE / UPDATE MARK
// ============================================================

async function saveMark(
    id = null
) {

    const studentId =
        Number(
            document.getElementById(
                "mark_student"
            ).value
        );


    const subjectId =
        Number(
            document.getElementById(
                "mark_subject"
            ).value
        );


    const academicYear =
        document.getElementById(
            "mark_year"
        ).value.trim();


    const term =
        document.getElementById(
            "mark_term"
        ).value;


    const mark =
        Number(
            document.getElementById(
                "mark_value"
            ).value
        );


    const teacherComment =
        document.getElementById(
            "teacher_comment"
        ).value.trim();


    const message =
        document.getElementById(
            "markMessage"
        );


    if (!studentId) {

        showMarkError(
            message,
            "Please select a student."
        );

        return;

    }


    if (!subjectId) {

        showMarkError(
            message,
            "Please select a subject."
        );

        return;

    }


    if (!academicYear) {

        showMarkError(
            message,
            "Academic year is required."
        );

        return;

    }


    if (!term) {

        showMarkError(
            message,
            "Please select a term."
        );

        return;

    }


    if (
        Number.isNaN(mark) ||
        mark < 0 ||
        mark > 100
    ) {

        showMarkError(
            message,
            "Mark must be between 0 and 100."
        );

        return;

    }


    const payload = {

        student_id:
            studentId,

        subject_id:
            subjectId,

        academic_year:
            academicYear,

        term:
            term,

        mark:
            mark,

        teacher_comment:
            teacherComment || null

    };


    try {

        await apiRequest(

            id
                ? `/api/marks/${id}`
                : "/api/marks/",

            {

                method:
                    id
                        ? "PUT"
                        : "POST",

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


        alert(

            id
                ? "Mark updated successfully."
                : "Mark saved successfully."

        );


        await loadMarksPage();


    } catch (error) {

        console.error(
            error
        );


        showMarkError(
            message,
            error.message
        );

    }

}


// ============================================================
// ERROR
// ============================================================

function showMarkError(
    element,
    message
) {

    if (!element) {

        alert(message);

        return;

    }


    element.className =
        "message error";


    element.textContent =
        message;

}


// ============================================================
// VIEW MARK
// ============================================================

async function viewMark(
    id
) {

    try {

        const mark =
            await apiRequest(
                `/api/marks/${id}`
            );


        alert(

            "MARK / RESULT\n\n" +

            "ID: " +
            mark.id +

            "\nStudent: " +
            getStudentName(
                mark.student_id
            ) +

            "\nSubject: " +
            getSubjectName(
                mark.subject_id
            ) +

            "\nAcademic Year: " +
            mark.academic_year +

            "\nTerm: " +
            mark.term +

            "\nMark: " +
            mark.mark +

            "\nGrade: " +
            mark.grade_name +

            "\nGrade Point: " +
            mark.grade_point +

            "\nRemark: " +
            mark.grade_remark +

            "\nTeacher Comment: " +
            (
                mark.teacher_comment ||
                "-"
            )

        );


    } catch (error) {

        alert(
            error.message
        );

    }

}


// ============================================================
// EDIT MARK
// ============================================================

async function editMark(
    id
) {

    try {

        const mark =
            await apiRequest(
                `/api/marks/${id}`
            );


        showMarkForm(
            mark
        );


    } catch (error) {

        alert(
            error.message
        );

    }

}


// ============================================================
// DELETE MARK
// ============================================================

async function deleteMark(
    id
) {

    if (
        !confirm(
            "Are you sure you want to delete this mark?"
        )
    ) {

        return;

    }


    try {

        await apiRequest(

            `/api/marks/${id}`,

            {
                method: "DELETE"
            }

        );


        alert(
            "Mark deleted successfully."
        );


        await loadMarksPage();


    } catch (error) {

        alert(
            error.message
        );

    }

}
