<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students - School Solution</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

.container {
    width: 100%;
    padding: 25px;
}

.header {
    background: white;
    padding: 20px 25px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.header h1 {
    font-size: 28px;
    margin-bottom: 5px;
}

.header p {
    color: #777;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

.back-btn {
    background: #333;
    color: white;
}

.toolbar {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.toolbar input {
    flex: 1;
    min-width: 250px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

.add-btn {
    background: #198754;
    color: white;
}

.refresh-btn {
    background: #0d6efd;
    color: white;
}

.form-card {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.form-card.active {
    display: block;
}

.form-card h2 {
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-weight: bold;
}

input,
select,
textarea {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

.form-buttons {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.save-btn {
    background: #198754;
    color: white;
}

.cancel-btn {
    background: #6c757d;
    color: white;
}

.table-card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #f8f9fa;
}

tr:hover {
    background: #fafafa;
}

.actions {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.view-btn {
    background: #0dcaf0;
    color: #000;
}

.edit-btn {
    background: #ffc107;
    color: #000;
}

.delete-btn {
    background: #dc3545;
    color: white;
}

.class-btn {
    background: #6f42c1;
    color: white;
}

.message {
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
    display: none;
}

.success {
    display: block;
    background: #d1e7dd;
    color: #0f5132;
}

.error {
    display: block;
    background: #f8d7da;
    color: #842029;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.5);
    padding: 30px;
}

.modal.active {
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 750px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 12px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close-btn {
    background: #dc3545;
    color: white;
}

.detail-row {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.detail-row strong {
    display: inline-block;
    min-width: 150px;
}

@media (max-width: 700px) {

    .container {
        padding: 10px;
    }

    .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div>
            <h1>👨‍🎓 Students</h1>
            <p>Manage student records</p>
        </div>

        <button
            class="back-btn"
            onclick="goDashboard()"
        >
            ← Dashboard
        </button>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Search student ID, name, parent, phone..."
            oninput="filterStudents()"
        >

        <button
            class="add-btn"
            onclick="openAddForm()"
        >
            ➕ Add Student
        </button>

        <button
            class="refresh-btn"
            onclick="loadStudents()"
        >
            🔄 Refresh
        </button>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- FORM -->

    <div
        id="formCard"
        class="form-card"
    >

        <h2 id="formTitle">
            Add Student
        </h2>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Student ID *
                </label>

                <input
                    type="text"
                    id="studentId"
                    placeholder="Example: STU001"
                >

            </div>


            <div class="form-group">

                <label>
                    First Name *
                </label>

                <input
                    type="text"
                    id="firstName"
                    placeholder="First name"
                >

            </div>


            <div class="form-group">

                <label>
                    Last Name *
                </label>

                <input
                    type="text"
                    id="lastName"
                    placeholder="Last name"
                >

            </div>


            <div class="form-group">

                <label>
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dateOfBirth"
                >

            </div>


            <div class="form-group">

                <label>
                    Gender
                </label>

                <select id="gender">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Class
                </label>

                <select id="classId">

                    <option value="">
                        Select Class
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Parent / Guardian Name
                </label>

                <input
                    type="text"
                    id="parentName"
                    placeholder="Parent name"
                >

            </div>


            <div class="form-group">

                <label>
                    Parent Phone
                </label>

                <input
                    type="text"
                    id="parentPhone"
                    placeholder="Phone number"
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                >

            </div>


            <div class="form-group">

                <label>
                    Admission Date
                </label>

                <input
                    type="date"
                    id="admissionDate"
                >

            </div>


            <div class="form-group full">

                <label>
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Student address"
                ></textarea>

            </div>

        </div>


        <div class="form-buttons">

            <button
                class="save-btn"
                onclick="saveStudent()"
            >
                💾 Save Student
            </button>

            <button
                class="cancel-btn"
                onclick="closeForm()"
            >
                Cancel
            </button>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Student ID</th>

                    <th>Name</th>

                    <th>Gender</th>

                    <th>Class</th>

                    <th>Parent</th>

                    <th>Phone</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="studentsTable">

                <tr>

                    <td
                        colspan="9"
                        class="empty"
                    >
                        Loading students...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- VIEW MODAL -->

<div
    id="viewModal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Student Details
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>

        <div id="studentDetails"></div>

    </div>

</div>


<script>

const API_URL =
    "http://127.0.0.1:8000";

let students = [];

let classes = [];

let editingId = null;


// ======================================================
// START
// ======================================================

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        await loadClasses();

        await loadStudents();

    }
);


// ======================================================
// DASHBOARD
// ======================================================

function goDashboard() {

    window.location.href =
        "dashboard.html";

}


// ======================================================
// LOAD CLASSES
// ======================================================

async function loadClasses() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/classes/`
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.detail ||
                "Unable to load classes."
            );

        }

        classes = result;

        const select =
            document.getElementById(
                "classId"
            );

        select.innerHTML = `
            <option value="">
                Select Class
            </option>
        `;

        classes.forEach(function (item) {

            const option =
                document.createElement(
                    "option"
                );

            option.value = item.id;

            option.textContent =
                `${item.name} (${item.academic_year})`;

            select.appendChild(option);

        });

    }

    catch (error) {

        console.error(error);

        showMessage(
            "Could not load classes: " +
            error.message,
            "error"
        );

    }

}


// ======================================================
// LOAD STUDENTS
// ======================================================

async function loadStudents() {

    const table =
        document.getElementById(
            "studentsTable"
        );

    table.innerHTML = `
        <tr>
            <td colspan="9" class="empty">
                Loading students...
            </td>
        </tr>
    `;

    try {

        const response =
            await fetch(
                `${API_URL}/api/students/`
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.detail ||
                "Unable to load students."
            );

        }

        students = result;

        renderStudents(students);

    }

    catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="empty"
                >
                    ❌ ${escapeHtml(
                        error.message
                    )}
                </td>
            </tr>
        `;

        showMessage(
            error.message,
            "error"
        );

    }

}


// ======================================================
// RENDER STUDENTS
// ======================================================

function renderStudents(data) {

    const table =
        document.getElementById(
            "studentsTable"
        );


    if (!data || data.length === 0) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="empty"
                >
                    No students found.
                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        data.map(function (student) {

            const className =
                getClassName(
                    student.class_id
                );


            const fullName =
                `${student.first_name || ""} ${student.last_name || ""}`
                .trim();


            return `

                <tr>

                    <td>
                        ${student.id}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(
                                student.student_id
                            )}
                        </strong>
                    </td>

                    <td>
                        ${escapeHtml(
                            fullName
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.gender || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            className
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.parent_name || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.parent_phone || "-"
                        )}
                    </td>

                    <td>
                        ${
                            student.is_active
                            ? "✅ Active"
                            : "❌ Inactive"
                        }
                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="view-btn"
                                onclick="viewStudent(${student.id})"
                            >
                                👁 View
                            </button>

                            <button
                                class="class-btn"
                                onclick="viewStudentClass(${student.id})"
                            >
                                🏫 Class
                            </button>

                            <button
                                class="edit-btn"
                                onclick="editStudent(${student.id})"
                            >
                                ✏️ Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteStudent(${student.id})"
                            >
                                🗑 Delete
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }).join("");

}


// ======================================================
// CLASS NAME
// ======================================================

function getClassName(classId) {

    if (!classId) {

        return "-";

    }

    const item =
        classes.find(
            c => c.id == classId
        );


    if (!item) {

        return `Class #${classId}`;

    }


    return `${item.name} (${item.academic_year})`;

}


// ======================================================
// SEARCH
// ======================================================

function filterStudents() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    if (!search) {

        renderStudents(students);

        return;

    }


    const filtered =
        students.filter(
            function (student) {

                const fullName =
                    `${student.first_name || ""} ${student.last_name || ""}`;

                return (

                    String(
                        student.id || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        student.student_id || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    fullName
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(
                        student.parent_name || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        student.parent_phone || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    getClassName(
                        student.class_id
                    )
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    renderStudents(filtered);

}


// ======================================================
// OPEN ADD FORM
// ======================================================

function openAddForm() {

    editingId = null;

    document.getElementById(
        "formTitle"
    ).textContent =
        "Add Student";


    clearForm();


    document.getElementById(
        "formCard"
    ).classList.add("active");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ======================================================
// CLEAR FORM
// ======================================================

function clearForm() {

    document.getElementById(
        "studentId"
    ).value = "";

    document.getElementById(
        "firstName"
    ).value = "";

    document.getElementById(
        "lastName"
    ).value = "";

    document.getElementById(
        "dateOfBirth"
    ).value = "";

    document.getElementById(
        "gender"
    ).value = "";

    document.getElementById(
        "classId"
    ).value = "";

    document.getElementById(
        "parentName"
    ).value = "";

    document.getElementById(
        "parentPhone"
    ).value = "";

    document.getElementById(
        "email"
    ).value = "";

    document.getElementById(
        "admissionDate"
    ).value = "";

    document.getElementById(
        "address"
    ).value = "";

}


// ======================================================
// CLOSE FORM
// ======================================================

function closeForm() {

    editingId = null;

    document.getElementById(
        "formCard"
    ).classList.remove("active");

}


// ======================================================
// SAVE STUDENT
// ======================================================

async function saveStudent() {

    const studentId =
        document
            .getElementById("studentId")
            .value
            .trim();

    const firstName =
        document
            .getElementById("firstName")
            .value
            .trim();

    const lastName =
        document
            .getElementById("lastName")
            .value
            .trim();

    const dateOfBirth =
        document
            .getElementById("dateOfBirth")
            .value;

    const gender =
        document
            .getElementById("gender")
            .value;

    const classId =
        document
            .getElementById("classId")
            .value;

    const parentName =
        document
            .getElementById("parentName")
            .value
            .trim();

    const parentPhone =
        document
            .getElementById("parentPhone")
            .value
            .trim();

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const admissionDate =
        document
            .getElementById("admissionDate")
            .value;

    const address =
        document
            .getElementById("address")
            .value
            .trim();


    if (!studentId) {

        showMessage(
            "Student ID is required.",
            "error"
        );

        return;

    }


    if (!firstName) {

        showMessage(
            "First name is required.",
            "error"
        );

        return;

    }


    if (!lastName) {

        showMessage(
            "Last name is required.",
            "error"
        );

        return;

    }


    const data = {

        student_id: studentId,

        first_name: firstName,

        last_name: lastName,

        date_of_birth:
            dateOfBirth || null,

        gender:
            gender || "",

        parent_name:
            parentName || "",

        parent_phone:
            parentPhone || "",

        email:
            email || "",

        address:
            address || "",

        class_id:
            classId
                ? Number(classId)
                : null,

        admission_date:
            admissionDate || null

    };


    try {

        let response;


        if (editingId) {

            response =
                await fetch(
                    `${API_URL}/api/students/${editingId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

        }

        else {

            response =
                await fetch(
                    `${API_URL}/api/students/`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

        }


        const result =
            await response.json();


        if (!response.ok) {

            let errorMessage =
                result.detail ||
                "Unable to save student.";


            if (
                Array.isArray(
                    result.detail
                )
            ) {

                errorMessage =
                    result.detail
                        .map(
                            e =>
                                `${e.loc?.join(".")}: ${e.msg}`
                        )
                        .join("\n");

            }


            throw new Error(
                errorMessage
            );

        }


        showMessage(
            editingId
                ? "Student updated successfully."
                : "Student added successfully.",
            "success"
        );


        closeForm();

        await loadStudents();

    }

    catch (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


// ======================================================
// EDIT STUDENT
// ======================================================

async function editStudent(id) {

    try {

        const response =
            await fetch(
                `${API_URL}/api/students/${id}`
            );


        const student =
            await response.json();


        if (!response.ok) {

            throw new Error(
                student.detail ||
                "Unable to load student."
            );

        }


        editingId = id;


        document.getElementById(
            "formTitle"
        ).textContent =
            "Edit Student";


        document.getElementById(
            "studentId"
        ).value =
            student.student_id || "";


        document.getElementById(
            "firstName"
        ).value =
            student.first_name || "";


        document.getElementById(
            "lastName"
        ).value =
            student.last_name || "";


        document.getElementById(
            "dateOfBirth"
        ).value =
            formatDate(
                student.date_of_birth
            );


        document.getElementById(
            "gender"
        ).value =
            student.gender || "";


        document.getElementById(
            "classId"
        ).value =
            student.class_id || "";


        document.getElementById(
            "parentName"
        ).value =
            student.parent_name || "";


        document.getElementById(
            "parentPhone"
        ).value =
            student.parent_phone || "";


        document.getElementById(
            "email"
        ).value =
            student.email || "";


        document.getElementById(
            "admissionDate"
        ).value =
            formatDate(
                student.admission_date
            );


        document.getElementById(
            "address"
        ).value =
            student.address || "";


        document.getElementById(
            "formCard"
        ).classList.add("active");


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


// ======================================================
// VIEW STUDENT
// ======================================================

async function viewStudent(id) {

    try {

        const response =
            await fetch(
                `${API_URL}/api/students/${id}`
            );


        const student =
            await response.json();


        if (!response.ok) {

            throw new Error(
                student.detail ||
                "Unable to load student."
            );

        }


        const fullName =
            `${student.first_name || ""} ${student.last_name || ""}`
            .trim();


        document.getElementById(
            "studentDetails"
        ).innerHTML = `

            <div class="detail-row">
                <strong>ID:</strong>
                ${student.id}
            </div>

            <div class="detail-row">
                <strong>Student ID:</strong>
                ${escapeHtml(
                    student.student_id
                )}
            </div>

            <div class="detail-row">
                <strong>Name:</strong>
                ${escapeHtml(
                    fullName
                )}
            </div>

            <div class="detail-row">
                <strong>Date of Birth:</strong>
                ${escapeHtml(
                    formatDate(
                        student.date_of_birth
                    ) || "-"
                )}
            </div>

            <div class="detail-row">
                <strong>Gender:</strong>
                ${escapeHtml(
                    student.gender || "-"
                )}
            </div>

            <div class="detail-row">
                <strong>Class:</strong>
                ${escapeHtml(
                    getClassName(
                        student.class_id
                    )
                )}
            </div>

            <div class="detail-row">
                <strong>Parent / Guardian:</strong>
                ${escapeHtml(
                    student.parent_name || "-"
                )}
            </div>

            <div class="detail-row">
                <strong>Parent Phone:</strong>
                ${escapeHtml(
                    student.parent_phone || "-"
                )}
            </div>

            <div class="detail-row">
                <strong>Email:</strong>
                ${escapeHtml(
                    student.email || "-"
                )}
            </div>

            <div class="detail-row">
                <strong>Address:</strong>
                ${escapeHtml(
                    student.address || "-"
                )}
            </div>

            <div class="detail-row">
                <strong>Admission Date:</strong>
                ${escapeHtml(
                    formatDate(
                        student.admission_date
                    ) || "-"
                )}
            </div>

            <div class="detail-row">
                <strong>Status:</strong>
                ${
                    student.is_active
                    ? "✅ Active"
                    : "❌ Inactive"
                }
            </div>

        `;


        document.getElementById(
            "viewModal"
        ).classList.add("active");

    }

    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


// ======================================================
// VIEW STUDENT CLASS
// ======================================================

function viewStudentClass(id) {

    const student =
        students.find(
            s => s.id === id
        );


    if (!student) return;


    const className =
        getClassName(
            student.class_id
        );


    alert(
        `Student: ${student.first_name} ${student.last_name}\n\n` +
        `Class: ${className}`
    );

}


// ======================================================
// DELETE STUDENT
// ======================================================

async function deleteStudent(id) {

    const student =
        students.find(
            s => s.id === id
        );


    if (!student) return;


    const fullName =
        `${student.first_name || ""} ${student.last_name || ""}`
        .trim();


    const confirmed =
        confirm(
            `Delete student "${fullName}"?\n\n` +
            `Student ID: ${student.student_id}`
        );


    if (!confirmed) return;


    try {

        const response =
            await fetch(
                `${API_URL}/api/students/${id}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "Unable to delete student."
            );

        }


        showMessage(
            "Student deleted successfully.",
            "success"
        );


        await loadStudents();

    }

    catch (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


// ======================================================
// CLOSE MODAL
// ======================================================

function closeModal() {

    document.getElementById(
        "viewModal"
    ).classList.remove("active");

}


// ======================================================
// DATE FORMAT
// ======================================================

function formatDate(value) {

    if (!value) {

        return "";

    }


    return String(value)
        .substring(0, 10);

}


// ======================================================
// MESSAGE
// ======================================================

function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        message;


    element.className =
        `message ${type}`;


    setTimeout(
        function () {

            element.className =
                "message";

        },
        5000
    );

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
